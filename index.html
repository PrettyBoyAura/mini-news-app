  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      increment,
      arrayUnion
    } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

    const firebaseConfig = {
  apiKey: "AIzaSyB4nS8d1wOpfhi-hwXqor5IL3G6zjXvt3c",
  authDomain: "mininewsapp-f52cf.firebaseapp.com",
  projectId: "mininewsapp-f52cf",
  storageBucket: "mininewsapp-f52cf.firebasestorage.app",
  messagingSenderId: "740143898993",
  appId: "1:740143898993:web:a04c567223525caef216d0"
};

    const USING_FIREBASE =
      firebaseConfig.apiKey !== "PASTE_FROM_FIREBASE" &&
      firebaseConfig.authDomain !== "PASTE_FROM_FIREBASE" &&
      firebaseConfig.projectId !== "PASTE_FROM_FIREBASE" &&
      firebaseConfig.appId !== "PASTE_FROM_FIREBASE";

    const feed = document.getElementById("feed");
    const loadMoreBtn = document.querySelector(".load-more");
    const loginOverlay = document.getElementById("loginOverlay");
    const loginNameInput = document.getElementById("loginNameInput");
    const enterAppBtn = document.getElementById("enterAppBtn");
    const usernameDisplay = document.getElementById("usernameDisplay");
    const changeUsernameBtn = document.getElementById("changeUsernameBtn");
    const topProfileBtn = document.getElementById("topProfileBtn");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const avatarUploadInput = document.getElementById("avatarUploadInput");
    const logoutBtn = document.getElementById("logoutBtn");

    // Avatar upload
    avatarUploadInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        localStorage.setItem("userAvatar", ev.target.result);
        refreshUsernameDisplay();
      };
      reader.readAsDataURL(file);
    });

    let page = 1;
    const limit = 5;
    let isLoading = false;
    let hasMore = true;
    let currentQuery = "";
    let currentCategory = "world";
    let started = false;
// ADD THIS LINE:
const GNEWS_API_KEY = "5efdb72e4e6e47a7775ee69aa6b3b9b8";

    let app = null;
    let auth = null;
    let db = null;
    let authReady = false;

    if (USING_FIREBASE) {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    }

    function getUsername() {
      return localStorage.getItem("username") || "u/guest";
    }

    function setUsername(name) {
      localStorage.setItem("username", name);
    }

    function getAvatar() {
      return localStorage.getItem("userAvatar") || "";
    }

    function refreshUsernameDisplay() {
      const avatar = getAvatar();
      const name = getUsername();
      const avatarDisplay = document.getElementById("avatarDisplay");

      if (!usernameDisplay) return;
      usernameDisplay.textContent = name;

      if (avatarDisplay) {
        if (avatar) {
          avatarDisplay.innerHTML = `<img src="${avatar}" class="profile-avatar" id="avatarImg" alt="avatar">`;
        } else {
          const initial = name.replace("u/", "").charAt(0).toUpperCase() || "?";
          avatarDisplay.innerHTML = `<span class="avatar-default" id="avatarImg">${initial}</span>`;
        }
        // Make avatar clickable to upload
        document.getElementById("avatarImg").addEventListener("click", (e) => {
          e.stopPropagation();
          document.getElementById("avatarUploadInput").click();
        });
      }
    }

    function getUserVote(articleId) {
      return localStorage.getItem("uservote_" + articleId) || null;
    }

    function setUserVote(articleId, vote) {
      localStorage.setItem("uservote_" + articleId, vote);
    }

    function articleRef(article) {
      return doc(db, "articles", String(article.id));
    }

    function formatCommentTime(value) {
      try {
        return new Date(value).toLocaleString();
      } catch {
        return "just now";
      }
    }

    function buildCommentNode(comment) {
      const el = document.createElement("div");
      el.className = "comment";
      el.innerHTML = `
        ${comment.text}
        <small>${comment.user} • ${formatCommentTime(comment.time)}</small>
      `;
      return el;
    }

    function localGetArticle(articleId) {
      const key = "article_" + articleId;
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }

    function localSaveArticle(articleId, data) {
      localStorage.setItem("article_" + articleId, JSON.stringify(data));
    }

    async function ensureArticleData(article) {
      const articleId = String(article.id);

      if (!USING_FIREBASE) {
        let data = localGetArticle(articleId);

        if (!data) {
          data = {
            articleId,
            title: article.title || "",
            url: article.url || "",
            imageUrl: article.image_url || "",
            publishedAt: article.published_at || "",
            summary: article.summary || "",
            up: 0,
            down: 0,
            comments: []
          };
          localSaveArticle(articleId, data);
        } else {
          data.title = article.title || "";
          data.url = article.url || "";
          data.imageUrl = article.image_url || "";
          data.publishedAt = article.published_at || "";
          data.summary = article.summary || "";
          localSaveArticle(articleId, data);
        }

        return { articleId, data };
      }

      const ref = articleRef(article);
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        await setDoc(ref, {
          articleId,
          title: article.title || "",
          url: article.url || "",
          imageUrl: article.image_url || "",
          publishedAt: article.published_at || "",
          summary: article.summary || "",
          up: 0,
          down: 0,
          comments: []
        });
      } else {
        await setDoc(ref, {
          title: article.title || "",
          url: article.url || "",
          imageUrl: article.image_url || "",
          publishedAt: article.published_at || "",
          summary: article.summary || ""
        }, { merge: true });
      }

      const fresh = await getDoc(ref);
      return { articleId, ref, data: fresh.data() || {} };
    }

    async function getArticleState(article) {
      const articleId = String(article.id);

      if (!USING_FIREBASE) {
        const stored = localGetArticle(articleId);
        return stored || {
          articleId,
          title: article.title || "",
          url: article.url || "",
          imageUrl: article.image_url || "",
          publishedAt: article.published_at || "",
          summary: article.summary || "",
          up: 0,
          down: 0,
          comments: []
        };
      }

      const ref = articleRef(article);
      const snap = await getDoc(ref);
      return snap.data() || {};
    }

    async function saveArticleState(articleId, state) {
      if (!USING_FIREBASE) {
        localSaveArticle(articleId, state);
        return;
      }
      const ref = doc(db, "articles", String(articleId));
      await setDoc(ref, state, { merge: true });
    }
    async function fetchByCategory(category, query, page, limit) {
      // World → GNews
      if (category === "world") {
        const url = query
          ? `https://gnews.io/api/v4/search?q=${encodeURIComponent(query)}&lang=en&max=${limit}&page=${page}&apikey=${GNEWS_API_KEY}`
: `https://gnews.io/api/v4/top-headlines?category=world&lang=en&country=in&max=${limit}&page=${page}&apikey=${GNEWS_API_KEY}`;
        let data = { articles: [] };

try {
  const res = await fetch(url);
  
  if (!res.ok) {
    throw new Error("API error: " + res.status);
  }

  data = await res.json();
} catch (error) {
  console.error("GNews Fetch Error:", error);
  return [];
}
        return (data.articles || []).map((a, i) => ({
          id: "world_" + page + "_" + i,
          title: a.title || "",
          summary: a.description || "No summary available.",
          url: a.url || "",
          image_url: a.image || "",
          published_at: a.publishedAt || new Date().toISOString(),
          news_site: a.source?.name || "GNews World"
        }));
      }

      // Gaming → GNews Search
      if (category === "gaming") {
        const q = query ? `${query} gaming` : "gaming";
        const url = `https://gnews.io/api/v4/search?q=${encodeURIComponent(q)}&lang=en&max=${limit}&page=${page}&apikey=${GNEWS_API_KEY}`;
        const controller = new AbortController();
setTimeout(() => controller.abort(), 8000);

const res = await fetch(url, { signal: controller.signal });
        const data = await res.json();
        return (data.articles || []).map((a, i) => ({
          id: "gaming_" + page + "_" + i,
          title: a.title || "",
          summary: a.description || "No summary available.",
          url: a.url || "",
          image_url: a.image || "",
          published_at: a.publishedAt || new Date().toISOString(),
          news_site: a.source?.name || "Gaming News"
        }));
      }

      // Anime → Jikan API (Untouched)
      if (category === "anime") {
        const q = query || "";
        const url = q
          ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&page=${page}&limit=${limit}`
          : `https://api.jikan.moe/v4/top/anime?page=${page}&limit=${limit}`;
        const res = await fetch(url);
        const data = await res.json();
        return (data.data || []).map((a) => ({
          id: "jikan_" + a.mal_id,
          title: a.title || "",
          summary: a.synopsis || "No synopsis available.",
          url: a.url || "",
          image_url: a.images?.jpg?.large_image_url || "",
          published_at: a.aired?.from || new Date().toISOString(),
          news_site: "MyAnimeList"
        }));
      }

      // Tech → Hacker News (Untouched)
      if (category === "tech") {
        const topRes = await fetch("https://hacker-news.firebaseio.com/v0/topstories.json");
        const ids = await topRes.json();
        const slice = ids.slice((page - 1) * limit, page * limit);
        const stories = await Promise.all(
          slice.map(id => fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json()))
        );
        return stories.filter(s => s && s.title).map((s) => ({
          id: "hn_" + s.id,
          title: s.title || "",
          summary: s.text ? s.text.replace(/<[^>]+>/g, "").slice(0, 200) : "Click to read on Hacker News.",
          url: s.url || `https://news.ycombinator.com/item?id=${s.id}`,
          image_url: "",
          published_at: new Date(s.time * 1000).toISOString(),
          news_site: "Hacker News"
        }));
      }

      // Sports → GNews
      if (category === "sports") {
        const url = query
          ? `https://gnews.io/api/v4/search?q=${encodeURIComponent(query + " sports")}&lang=en&max=${limit}&page=${page}&apikey=${GNEWS_API_KEY}`
          : `https://gnews.io/api/v4/top-headlines?category=sports&lang=en&max=${limit}&page=${page}&apikey=${GNEWS_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        return (data.articles || []).map((a, i) => ({
          id: "sports_" + page + "_" + i,
          title: a.title || "",
          summary: a.description || "No summary available.",
          url: a.url || "",
          image_url: a.image || "",
          published_at: a.publishedAt || new Date().toISOString(),
          news_site: a.source?.name || "GNews Sports"
        }));
      }

      // Movies (TV Shows) → TVmaze API
      if (category === "movies") {
        if (query) {
           // Search endpoint (returns an array of { score, show })
           const url = `https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`;
           const res = await fetch(url);
           const data = await res.json();
           const slice = data.slice((page - 1) * limit, page * limit);
           return slice.map((item) => {
             const show = item.show;
             return {
               id: "tvmaze_" + show.id,
               title: show.name || "",
               summary: show.summary ? show.summary.replace(/<[^>]+>/g, "").slice(0, 300) : "No summary available.",
               url: show.url || "",
               image_url: show.image?.medium || show.image?.original || "",
               published_at: show.premiered || new Date().toISOString(),
               news_site: show.network?.name || "TVmaze"
             };
           });
        } else {
           // Standard browsing endpoint. 
           // TVmaze paginates by 250 items. We calculate the correct TVmaze page and our slice index.
           const tvmazePage = Math.floor(((page - 1) * limit) / 250);
           const startIndex = ((page - 1) * limit) % 250;
           
           const url = `https://api.tvmaze.com/shows?page=${tvmazePage}`;
           const res = await fetch(url);
           const data = await res.json();
           const slice = data.slice(startIndex, startIndex + limit);
           
           return slice.map((show) => ({
               id: "tvmaze_" + show.id,
               title: show.name || "",
               summary: show.summary ? show.summary.replace(/<[^>]+>/g, "").slice(0, 300) : "No summary available.",
               url: show.url || "",
               image_url: show.image?.medium || show.image?.original || "",
               published_at: show.premiered || new Date().toISOString(),
               news_site: show.network?.name || "TVmaze"
           }));
        }
      }

      return [];
    }

    async function loadNews(reset = false) {
      if (isLoading || !hasMore) return;

      try {
        if (reset) {
          feed.innerHTML = "";
          page = 1;
          hasMore = true;
        }

        isLoading = true;
        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = "Loading...";

        const articles = await fetchByCategory(currentCategory, currentQuery, page, limit);

        if (!articles || articles.length === 0) {
          hasMore = false;
          loadMoreBtn.textContent = "No more posts";
          return;
        }

        for (const article of articles) {
          const articleId = String(article.id);
          const ensured = await ensureArticleData(article);
          const state = await getArticleState(article);

          const post = document.createElement("div");
          post.className = "post";

          const comments = Array.isArray(state.comments) ? state.comments : [];
          const votes = {
            up: Number(state.up || 0),
            down: Number(state.down || 0)
          };

          const commentCount = comments.length;

          post.innerHTML = `
            ${article.image_url
              ? `<img class="post-image" src="${article.image_url}" alt="Post image">`
              : `<img class="post-image" src="https://picsum.photos/seed/${articleId}/800/400" alt="Post image">`}
            <div class="post-content">
              <div class="post-meta">
                <span>📰 ${article.news_site || 'Unknown Source'}</span>
                <span>${new Date(article.published_at).toLocaleString()}</span>
              </div>

              <div class="post-title">${article.title}</div>
              <div class="post-text">${article.summary || "No summary available."}</div>

              <div class="actions">
                <button class="btn upvote">▲ Upvote <span class="vote-up-count">${votes.up}</span></button>
                <button class="btn downvote">▼ Downvote <span class="vote-down-count">${votes.down}</span></button>
                <span class="btn-comment-wrap">
                  <button class="btn open-comments">💬 Comments</button>
                  <span class="comment-badge">${commentCount}</span>
                </span>
                <button class="btn open-link">🔗 Open Link</button>
              </div>
            </div>
          `;

          feed.appendChild(post);

          const upvoteBtn = post.querySelector(".upvote");
          const downvoteBtn = post.querySelector(".downvote");
          const upCount = post.querySelector(".vote-up-count");
          const downCount = post.querySelector(".vote-down-count");
          const openCommentsBtn = post.querySelector(".open-comments");
          const commentBadge = post.querySelector(".comment-badge");
          const openLinkBtn = post.querySelector(".open-link");

          function openCommentsModal() {
            const overlay = document.createElement("div");
            overlay.className = "comments-modal-overlay";
            overlay.innerHTML = `
              <div class="comments-modal">
                <div class="comments-modal-header">
                  <h3>💬 Comments (${comments.length})</h3>
                  <button class="comments-modal-close">✕</button>
                </div>
                <div class="comments-modal-list"></div>
                <div class="comments-modal-input">
                  <input type="text" placeholder="Write a comment..." />
                  <button>Post</button>
                </div>
              </div>
            `;
            document.body.appendChild(overlay);

            const modalList = overlay.querySelector(".comments-modal-list");
            const modalInput = overlay.querySelector(".comments-modal-input input");
            const modalPostBtn = overlay.querySelector(".comments-modal-input button");
            const closeBtn = overlay.querySelector(".comments-modal-close");

            function renderModalComments() {
              modalList.innerHTML = "";
              if (comments.length === 0) {
                modalList.innerHTML = `<p style="color:#9aa3b2;text-align:center;padding:20px;font-size:13px;">No comments yet. Be the first!</p>`;
                return;
              }
              [...comments].reverse().forEach(comment => {
                modalList.appendChild(buildCommentNode(comment));
              });
            }

            renderModalComments();

            closeBtn.addEventListener("click", () => overlay.remove());
            overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });

            modalPostBtn.addEventListener("click", async () => {
              const text = modalInput.value.trim();
              if (!text) return;

              const newComment = { text, user: getUsername(), time: new Date().toISOString() };

              if (!USING_FIREBASE) {
                const current = localGetArticle(articleId) || { up: 0, down: 0, comments: [] };
                current.comments = Array.isArray(current.comments) ? current.comments : [];
                current.comments.push(newComment);
                localSaveArticle(articleId, current);
                comments.push(newComment);
                modalInput.value = "";
                renderModalComments();
                commentBadge.textContent = comments.length;
                overlay.querySelector(".comments-modal-header h3").textContent = `💬 Comments (${comments.length})`;
                return;
              }

              try {
                await updateDoc(ensured.ref || articleRef(article), { comments: arrayUnion(newComment) });
                comments.push(newComment);
                modalInput.value = "";
                renderModalComments();
                commentBadge.textContent = comments.length;
                overlay.querySelector(".comments-modal-header h3").textContent = `💬 Comments (${comments.length})`;
              } catch (err) {
                console.error("Comment save failed:", err);
              }
            });

            modalInput.addEventListener("keydown", (e) => { if (e.key === "Enter") modalPostBtn.click(); });
            modalInput.focus();
          }

          openCommentsBtn.addEventListener("click", openCommentsModal);

          upvoteBtn.addEventListener("click", async () => {
            const currentVote = getUserVote(articleId);
            if (currentVote === "up") return;

            if (!USING_FIREBASE) {
              const current = localGetArticle(articleId) || { up: 0, down: 0, comments: [] };
              if (currentVote === "down") current.down = Math.max(0, (current.down || 0) - 1);
              current.up = (current.up || 0) + 1;
              localSaveArticle(articleId, current);
              setUserVote(articleId, "up");
              upCount.textContent = current.up;
              downCount.textContent = current.down || 0;
              return;
            }

            const payload = { up: increment(1) };
            if (currentVote === "down") payload.down = increment(-1);

            try {
              await updateDoc(ensured.ref || articleRef(article), payload);
              if (currentVote === "down") votes.down -= 1;
              votes.up += 1;
              setUserVote(articleId, "up");
              upCount.textContent = votes.up;
              downCount.textContent = votes.down;
            } catch (err) {
              console.error("Upvote failed:", err);
            }
          });

          downvoteBtn.addEventListener("click", async () => {
            const currentVote = getUserVote(articleId);
            if (currentVote === "down") return;

            if (!USING_FIREBASE) {
              const current = localGetArticle(articleId) || { up: 0, down: 0, comments: [] };
              if (currentVote === "up") current.up = Math.max(0, (current.up || 0) - 1);
              current.down = (current.down || 0) + 1;
              localSaveArticle(articleId, current);
              setUserVote(articleId, "down");
              upCount.textContent = current.up || 0;
              downCount.textContent = current.down;
              return;
            }

            const payload = { down: increment(1) };
            if (currentVote === "up") payload.up = increment(-1);

            try {
              await updateDoc(ensured.ref || articleRef(article), payload);
              if (currentVote === "up") votes.up -= 1;
              votes.down += 1;
              setUserVote(articleId, "down");
              upCount.textContent = votes.up;
              downCount.textContent = votes.down;
            } catch (err) {
              console.error("Downvote failed:", err);
            }
          });

          openLinkBtn.addEventListener("click", () => {
            window.open(article.url, "_blank");
          });
        }

        page += 1;
        loadMoreBtn.textContent = "Loading more as you scroll...";
      } catch (err) {
        console.error("Error fetching news:", err);
        feed.innerHTML = `<div style="color:#ff6b6b;padding:20px;text-align:center;font-size:14px;">
          ❌ Error: ${err.message}<br><br>
          <small style="color:#9aa3b2">${err.stack || ''}</small>
        </div>`;
        loadMoreBtn.style.display = "none";
      } finally {
        isLoading = false;
        loadMoreBtn.disabled = false;
      }
    }

    function openApp() {
      loginOverlay.classList.add("hidden");
      refreshUsernameDisplay();

      if (!started) {
        started = true;
        feed.innerHTML = "";
        page = 1;
        hasMore = true;
        loadNews(true);
      }
    }

    enterAppBtn.addEventListener("click", async () => {
      const name = loginNameInput.value.trim();
      if (!name) return;

      setUsername(name.startsWith("u/") ? name : "u/" + name);

      if (USING_FIREBASE) {
        try {
          await signInAnonymously(auth);
          authReady = true;
        } catch (err) {
          console.error("Anonymous auth failed:", err);
          // Don't block -- continue to app anyway
        }
      }

      openApp();
    });

    loginNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enterAppBtn.click();
    });

    changeUsernameBtn.addEventListener("click", () => {
      const name = prompt("Enter a new username:", getUsername());
      if (name && name.trim()) {
        setUsername(name.trim());
        refreshUsernameDisplay();
      }
    });

    topProfileBtn.addEventListener("click", () => {
      const name = prompt("Enter a new username:", getUsername());
      if (name && name.trim()) {
        setUsername(name.trim());
        refreshUsernameDisplay();
      }
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("username");
      localStorage.removeItem("userAvatar");
      localStorage.removeItem("loginType");
      loginOverlay.classList.remove("hidden");
      loginNameInput.value = "";
      loginNameInput.focus();
    });

    window.addEventListener("scroll", () => {
      if (!hasMore || isLoading) return;

      const scrollPosition = window.innerHeight + window.scrollY;
      const bottomPosition = document.body.offsetHeight - 200;

      if (scrollPosition >= bottomPosition) {
        loadNews();
      }
    });

    loadMoreBtn.style.display = "none";

    if (searchInput) {
      searchInput.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") searchBtn.click();
      });
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        currentQuery = "";
        searchInput.value = "";
        page = 1;
        hasMore = true;
        feed.innerHTML = "";
        await loadNews(true);
      });
    });

    searchBtn.addEventListener("click", async () => {
      currentQuery = searchInput.value.trim();
      page = 1;
      hasMore = true;
      feed.innerHTML = "";
      await loadNews(true);
    });

    refreshUsernameDisplay();
    loginOverlay.classList.remove("hidden");
    loginNameInput.focus();
  </script>
</body>
</html>
